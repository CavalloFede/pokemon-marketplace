services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        - VITE_API_URL=http://localhost:3000
    container_name: pokemon-web
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pokemon-network

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: pokemon-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://pokemon:pokemon123@postgres:5432/pokemon_marketplace
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGIN=http://localhost:5173
      - LOG_LEVEL=info
      - AUTH_MODE=mock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - pokemon-network

  postgres:
    image: postgres:15-alpine
    container_name: pokemon-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=pokemon
      - POSTGRES_PASSWORD=pokemon123
      - POSTGRES_DB=pokemon_marketplace
      - POSTGRES_HOST_AUTH_METHOD=md5
      - POSTGRES_INITDB_ARGS=--auth-host=md5
    volumes:
      - postgres-storage:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokemon -d pokemon_marketplace"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pokemon-network

  redis:
    image: redis:7-alpine
    container_name: pokemon-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-storage:/data
    restart: unless-stopped
    networks:
      - pokemon-network

  grafana:
    image: grafana/grafana:latest
    container_name: pokemon-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=pokemon123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - pokemon-network

  prometheus:
    image: prom/prometheus:latest
    container_name: pokemon-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-storage:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - pokemon-network

networks:
  pokemon-network:
    driver: bridge

volumes:
  postgres-storage:
  redis-storage:
  grafana-storage:
  prometheus-storage:
