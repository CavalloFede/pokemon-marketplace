global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Pokemon Marketplace API (Docker network)
  - job_name: 'pokemon-api'
    static_configs:
      - targets: ['api:3000']
    metrics_path: /metrics
    scrape_interval: 10s

  # Pokemon Marketplace API (when running locally without Docker)
  # Uncomment below if running API outside Docker
  # - job_name: 'pokemon-api-local'
  #   static_configs:
  #     - targets: ['host.docker.internal:3000']
  #   metrics_path: /metrics
  #   scrape_interval: 10s
