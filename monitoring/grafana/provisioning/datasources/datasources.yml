apiVersion: 1

datasources:
  # CloudWatch - Requires AWS credentials
  - name: CloudWatch
    type: cloudwatch
    access: proxy
    uid: cloudwatch
    jsonData:
      authType: default  # Uses AWS credentials from environment
      defaultRegion: us-east-1
      customMetricsNamespaces: PokemonMarketplace
    # For local development, use keys (not recommended for production)
    # secureJsonData:
    #   accessKey: YOUR_ACCESS_KEY
    #   secretKey: YOUR_SECRET_KEY

  # Prometheus - For local metrics
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
