name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  # Check PR title follows conventional commits
  pr-title:
    name: PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" should start with a lowercase letter.

  # Check for changes in specific areas
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      shared: ${{ steps.filter.outputs.shared }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for changes
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'
            shared:
              - 'packages/shared/**'
            terraform:
              - 'terraform/**'

  # API specific checks
  api-checks:
    name: API Checks
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.api == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint API
        run: pnpm --filter @pokemon-marketplace/api lint

      - name: Type Check API
        run: pnpm --filter @pokemon-marketplace/api type-check

      - name: Test API
        run: pnpm --filter @pokemon-marketplace/api test:unit

      - name: Build API
        run: pnpm --filter @pokemon-marketplace/api build

  # Web specific checks
  web-checks:
    name: Web Checks
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Web
        run: pnpm --filter @pokemon-marketplace/web lint

      - name: Type Check Web
        run: pnpm --filter @pokemon-marketplace/web type-check

      - name: Test Web
        run: pnpm --filter @pokemon-marketplace/web test:unit

      - name: Build Web
        run: pnpm --filter @pokemon-marketplace/web build

  # Bundle size check
  bundle-size:
    name: Bundle Size
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @pokemon-marketplace/web build

      - name: Check bundle size
        run: |
          BUNDLE_SIZE=$(du -sb apps/web/dist | cut -f1)
          BUNDLE_SIZE_MB=$(echo "scale=2; $BUNDLE_SIZE / 1048576" | bc)
          echo "Bundle size: ${BUNDLE_SIZE_MB}MB"

          # Warn if bundle is larger than 2MB
          if (( $(echo "$BUNDLE_SIZE_MB > 2" | bc -l) )); then
            echo "::warning::Bundle size (${BUNDLE_SIZE_MB}MB) exceeds 2MB threshold"
          fi

          # Fail if bundle is larger than 5MB
          if (( $(echo "$BUNDLE_SIZE_MB > 5" | bc -l) )); then
            echo "::error::Bundle size (${BUNDLE_SIZE_MB}MB) exceeds 5MB limit"
            exit 1
          fi

  # Security scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}

  # Summarize results
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [pr-title, api-checks, web-checks, bundle-size, security]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.pr-title.result }}" == "failure" ]; then
            echo "PR title check failed"
            exit 1
          fi
          if [ "${{ needs.api-checks.result }}" == "failure" ]; then
            echo "API checks failed"
            exit 1
          fi
          if [ "${{ needs.web-checks.result }}" == "failure" ]; then
            echo "Web checks failed"
            exit 1
          fi
          if [ "${{ needs.bundle-size.result }}" == "failure" ]; then
            echo "Bundle size check failed"
            exit 1
          fi
          if [ "${{ needs.security.result }}" == "failure" ]; then
            echo "Security scan failed"
            exit 1
          fi
          echo "All checks passed!"
