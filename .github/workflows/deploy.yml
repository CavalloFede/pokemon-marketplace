name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'
  AWS_REGION: us-east-1

jobs:
  # Determine environment
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

  # Build API
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @pokemon-marketplace/api build

      - name: Package Lambda
        run: |
          cd apps/api
          zip -r dist/lambda.zip dist/ node_modules/ package.json

      - name: Upload Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: apps/api/dist/lambda.zip
          retention-days: 1

  # Build Frontend
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [setup]
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        run: pnpm --filter @pokemon-marketplace/web build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_COGNITO_DOMAIN: ${{ vars.COGNITO_DOMAIN }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          VITE_COGNITO_REDIRECT_URI: ${{ vars.COGNITO_REDIRECT_URI }}

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/web/dist/
          retention-days: 1

  # Deploy API to Lambda
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: [setup, build-api]
    environment: ${{ needs.setup.outputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download Lambda artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-package
          path: ./

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name pokemon-marketplace-api-${{ needs.setup.outputs.environment }} \
            --zip-file fileb://lambda.zip \
            --publish

      - name: Wait for deployment
        run: |
          aws lambda wait function-updated \
            --function-name pokemon-marketplace-api-${{ needs.setup.outputs.environment }}

      - name: Run database migrations
        run: |
          aws lambda invoke \
            --function-name pokemon-marketplace-api-${{ needs.setup.outputs.environment }} \
            --payload '{"action": "migrate"}' \
            --cli-binary-format raw-in-base64-out \
            response.json
          cat response.json

  # Deploy Frontend to S3/CloudFront
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [setup, build-frontend, deploy-api]
    environment: ${{ needs.setup.outputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync ./dist s3://${{ vars.S3_BUCKET_NAME }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "*.json"

          # Upload index.html and JSON files with no-cache
          aws s3 sync ./dist s3://${{ vars.S3_BUCKET_NAME }} \
            --cache-control "no-cache, no-store, must-revalidate" \
            --exclude "*" \
            --include "index.html" \
            --include "*.json"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  # Post-deployment verification
  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [setup, deploy-frontend]
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Health check
        run: |
          # Wait for CloudFront propagation
          sleep 30

          # Check frontend
          curl -f -s -o /dev/null -w "%{http_code}" ${{ vars.WEBSITE_URL }} || exit 1
          echo "Frontend is healthy"

          # Check API health
          curl -f -s -o /dev/null -w "%{http_code}" ${{ vars.API_URL }}/health || exit 1
          echo "API is healthy"

      - name: Notify success
        if: success()
        run: |
          echo "Deployment to ${{ needs.setup.outputs.environment }} completed successfully!"
          echo "Website: ${{ vars.WEBSITE_URL }}"
          echo "API: ${{ vars.API_URL }}"
